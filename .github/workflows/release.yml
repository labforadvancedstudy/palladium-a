name: Release

# Stable channel. Tagging v* publishes a release whose artifacts contain the
# compiler AND its C runtime. A pdc without runtime/ cannot link anything, so
# shipping the bare binary — which this workflow used to do, under a binary name
# (`palladium`) that does not exist — produces an install that fails on the
# user's first compile.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pdc-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: pdc-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pdc-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin pdc

      - name: Stage install layout
        run: |
          set -euo pipefail
          stage="${{ matrix.artifact }}"
          mkdir -p "$stage/bin" "$stage/share/palladium"
          cp "target/${{ matrix.target }}/release/pdc" "$stage/bin/pdc"
          cp -R runtime "$stage/share/palladium/runtime"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" | tee "$stage.tar.gz.sha256"

      - name: Smoke test the staged layout
        run: |
          set -euo pipefail
          stage="$PWD/${{ matrix.artifact }}"
          host="$(rustc -vV | sed -n 's/host: //p')"
          if [ "${{ matrix.target }}" != "$host" ]; then
            echo "smoke: skipped (artifact is cross-compiled for ${{ matrix.target }})"
            exit 0
          fi
          # The binary must find its runtime from its own install location,
          # with no help from the repository or the working directory.
          work=$(mktemp -d); cd "$work"
          printf 'fn main() { print("release-smoke-ok"); }\n' > s.pd
          "$stage/bin/pdc" --print-runtime
          "$stage/bin/pdc" compile s.pd -o s
          ./build_output/s | grep -q release-smoke-ok
          echo "smoke: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release

      - name: Release notes
        run: |
          {
            echo "## Install"
            echo
            echo '```bash'
            echo 'brew tap 2lab-ai/tap'
            echo 'brew install pdc'
            echo '```'
            echo
            echo "## Artifacts"
            echo
            echo 'Each archive contains `bin/pdc` and `share/palladium/runtime`.'
            echo 'The runtime is required: pdc emits C and links it at compile time.'
            echo
            echo "## Verify an install"
            echo
            echo '```bash'
            echo 'pdc --print-runtime'
            echo 'cd /tmp && printf "fn main() { print(\"ok\"); }\n" > ok.pd'
            echo 'pdc compile ok.pd -o ok && ./build_output/ok'
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: release/*
