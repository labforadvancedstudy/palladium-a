[core_language.functions.tail_returns]
description = "A function body's trailing expression is its return value."
spec = "../../specification/language-spec.md#n5-statements-and-expressions"
implementation = "partial"
evidence = [
  "cmd: pdc compile 'fn add(a: i64, b: i64) -> i64 { a + b } fn main(){ print_int(add(2,3)); }' -> prints 5 (tail expression is lowered)",
  "cmd: pdc compile 'fn fib(n: i64) -> i64 { if n <= 1 { n } else { fib(n-1)+fib(n-2) } } fn main(){ print_int(fib(10)); }' -> compiles clean, prints 8261746944; the answer is 55",
  "src: src/codegen/mod.rs:1967 match/if lower to bare statement forms, so a tail `if` emits expression statements with no return",
]
note = "Defect D3 is half-fixed: a tail EXPRESSION becomes a return, a tail `if` does not, and the tail-`if` shape is the idiomatic one for a recursive function. CLAUDE.md:66 records D3 as fixed, which holds only for the expression case. The \"437 affected sites\" figure is an understatement — the heuristic behind it cannot see a function ending in the else block's brace."

