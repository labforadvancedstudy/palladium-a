# Palladium feature index
#
# WHAT THIS FILE IS. It used to be `status.yaml`, a progress tracker: every feature
# carried status glyphs and `progress: <N>`, plus a top-level `self_hosting_progress: 60%`.
# Not one of those numbers came from a measurement, several flattered the project
# ("generics: 85", "traits: 70" for features that emit no code at all), and a percentage
# is unfalsifiable by construction — no command can disagree with it. They are deleted.
#
# WHY TOML, AND NOT YAML. This was `.yaml` until 2026-08-22. Reading it required either
# PyYAML — an unprovisioned host dependency — or a hand-rolled parser, and the hand-rolled
# parser could only be held honest by differentially testing it against PyYAML, which is
# available exactly when it is not needed. That is a class of bug, not an instance: a
# second parser can always disagree with the first. TOML is in the standard library
# (`tomllib`, Python 3.11+), so there is ONE parser, nobody's fallback, and no differential
# test to maintain. This file is a machine-readable index; nothing here is hand-written
# prose that needed YAML's ergonomics.
#
# SCHEMA. One [table] per feature, nested to mirror the taxonomy:
#
#   description     what the feature is.
#   spec            where it is DEFINED. The definition does not change when the compiler
#                   does. Paths are relative to this file.
#   implementation  what `pdc` does today: implemented | partial | unimplemented
#   evidence        an array. Every item must be checkable and must begin with one of four
#                   tags. Prose is not evidence; it goes in `note`.
#   note            optional prose. Never load-bearing.
#
# EVIDENCE TAGS (enforced by scripts/check-doc-evidence.sh):
#
#   src: <path>:<line>[-<line>] <symbol or quoted text>
#       A non-documentation repository file. Path and range are checked to exist, the range
#       is pinned by fingerprint in docs/citation-pins.tsv, and any text quoted in backticks
#       or double quotes must actually appear in the cited range — a citation whose excerpt
#       does not contain the thing being claimed is the failure the pin file exists to expose.
#
#   cmd: <command> -> exit <N>, <M> lines[ -- <prose>]
#       A reproducible command and what it produced. THIS IS HOW AN ABSENCE IS PROVED:
#       a grep that returns nothing, quoted with its exit status. "There is no X" on its own
#       is an assertion, not evidence, and the gate rejects it.
#
#       THE GATE RUNS THE COMMAND. Until 2026-08-22 it did not: it checked that the string
#       had the SHAPE `cmd: X -> Y` and never executed X, so the entire absence-proving
#       mechanism was unexecuted text. Nine of the 53 items were false when first run --
#       including `grep -rn 'effects::' src/ | grep -v '^src/effects' -> 1 line`, which
#       produces 8, and `grep -rniE 'socket|TcpStream|BufReader' src/runtime/ -> exit 1,
#       0 lines`, which produces 95 over a src/runtime/net.rs the row said did not exist.
#
#       The result is therefore a contract a machine can disagree with: the exit status and
#       the line count are compared, and `exit 1, 0 lines` is the SUCCESS case for an
#       absence proof. Prose after ` -- ` is a reading of the output and carries the same
#       status a `src:` claim carries about its cited range, so it gets the same rule:
#       anything it quotes must actually appear in the output.
#
#       A `cmd:` is a HERMETIC OBSERVATION of the checked-in tree -- grep, ls, find, sort,
#       wc, over a plain pipeline, no shell. It may not run pdc, cargo or make, and may not
#       read target/ or build_output/. Nothing is skipped: an item the gate cannot run
#       hermetically is a lint error naming the gate that owns the question, because a
#       skipped item that reports nothing is the same unmeasured denominator one layer down.
#
#   conformance: <path>.pd <class>        a fixture and the class tests/conformance-manifest.txt
#                                         declares for it: run | untranscribed | vacuous |
#                                         xfail | reject | skip. The class is looked up in the
#                                         manifest, so it cannot drift. It used to be a
#                                         PASS/COMPILE_FAIL vocabulary checked against nothing
#                                         but the file's existence, which is how six rows read
#                                         `PASS (placeholder: only prints that the feature is
#                                         unimplemented)` -- the manifest's `vacuous` class
#                                         wearing the word PASS.
#   gate: <make target> -> <result>       a project gate and its outcome. NOT EXECUTED by this
#                                         gate: running `make conformance` from inside
#                                         `make check-docs` is recursive. These results are
#                                         hand-recorded and are the weakest evidence class here.
#
# WHY A PROGRAM IS NOT A `cmd:`. Sixteen items used to read `cmd: pdc compile '<a whole .pd
# program>' -> <diagnostic or behaviour>`. Those are conformance fixtures written in prose.
# Executing them here would give the repository two engines that can disagree about whether a
# program is rejected -- the same class of bug as the second YAML parser above -- and would put
# a corpus of programs in nobody's closed inventory, unable to go MISSING and unable to be
# UNDECLARED. They are now real fixtures under tests/reject/ and tests/regression/, declared in
# tests/conformance-manifest.txt, and cited here as `conformance:`. Two of them arrived FALSE.
#
# CAUTION about conformance evidence. Six files under tests/ are named after a feature and
# PASS without exercising it: 07_traits_basic, 08_generics_basic, 09_effects_system,
# 10_async_await, 11_unsafe_blocks and 12_modules_imports each only `print` a message saying
# the feature is unimplemented. A green row for those names is evidence of nothing.
#
# Measured at commit 2ef170f (2026-08-22):
#   cargo build --release && scripts/conformance.sh tests examples
#     -> fixtures=65 declared_in_scope=65 evaluated=65
#        verified=45 untranscribed=0 vacuous=7 xfail=1 reject=10 skip=2 failures=0

[meta]
measured_at = "2ef170f"
measured_on = "2026-08-22"
specification = "../../specification/language-spec.md"
annex = "../../specification/language-spec.md#part-ii-implementation-status-annex"

[core_language.memory_management.implicit_lifetimes]
description = "Lifetimes inferred; no 'a parameter lists. Explicit ref<'a> T only on ambiguity."
spec = "core-language/implicit-lifetimes.md"
implementation = "unimplemented"
evidence = [
  "cmd: grep -rn 'region\\|Region' src/ --include='*.rs' -> exit 1, 0 lines",
  "src: src/parser/mod.rs:553 lifetime_params, populated by the parser",
  "cmd: grep -rn lifetime_params src/ --include='*.rs' | grep -v '^src/parser' -> exit 0, 83 lines -- and they are REAL readers, not test fixtures: src/typeck/mod.rs clones the list into its own records and src/codegen/mod.rs branches on `lifetime_params.is_empty()` before emitting a type",
]
note = "This row used to rest on \"0 real readers; every hit is `lifetime_params: vec![]` in a test fixture\". Executed, that is false: 83 hits across 13 files, of which typeck and codegen are load-bearing. The correction does NOT change the verdict, it changes the argument. Explicit lifetime lists are parsed and carried end to end -- which is the annotation burden this feature exists to remove. What is absent is the INFERENCE: there is no region or constraint machinery anywhere (the `region|Region` probe above is empty), so nothing could infer a lifetime that was not written down."

