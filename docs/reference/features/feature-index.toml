note = "See reference/builtins.md, generated from src/builtins.rs. The evidence here used to read \"exit 1, 0 lines -- no network, no buffering\" over src/runtime/. Executed, that command returns 95 lines: a whole net.rs exists. It is dead Rust, and the decisive point is WHERE it lives: src/runtime/ is compiled into the pdc binary, while a Palladium program links runtime/palladium_runtime.c, which has no socket surface at all. So the conclusion does not depend on src/builtins.rs being the only language-to-runtime bridge -- the code is on the other side of the compiler from anything a program could reach. This is the difference between \"the code is not there\" and \"the code is there and unreachable\", and only the second one is true."

