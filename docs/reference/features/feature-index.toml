[core_language.memory_management.array_parameter_semantics]
description = "Whether a [T; N] parameter copies or aliases the caller's array. OPEN DECISION."
spec = "../../specification/language-spec.md#n121-array-parameters-open-decision"
implementation = "unimplemented"
evidence = [
  "src: src/codegen/mod.rs:3093-3093 the Type::Array parameter arm, \"In C, array parameters are passed as pointers\"",
  "conformance: tests/regression/array_param_mut_write.pd run",
  "conformance: tests/reject/array_param_write_byvalue.pd reject",
  "src: src/codegen/mod.rs:3113-3119 the reference arm lowers `&[T; N]` and `&mut [T; N]` through the same declarator: \"C decays both to a pointer to the first element\"",
  "conformance: tests/regression/array_reference_params.pd run",
]
note = "Marked unimplemented because no spelling copies: every array parameter decays to a pointer in C, so a callee that writes always reaches the caller's storage. The previous note described two behaviours this compiler no longer has -- it said mutation through a bare non-mut array was permitted, and that &mut [T; N] was rejected outright. Both were re-measured on 2026-08-22 and both are false: the bare by-value write is refused by codegen with a diagnostic naming the open decision, and &mut [T; N] compiles and is covered by a passing fixture. What remains open is the specification question, not a hole in the implementation: nothing here COPIES, so Option A (value semantics) is unimplemented, and Option B (reference semantics) would still need a rule that does not exist. See language-spec.md N12.1 and A9.2."

