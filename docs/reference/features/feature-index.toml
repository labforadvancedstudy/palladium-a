  "src: src/ownership/borrow_checker.rs:982 let call_lifetime = self.context.new_lifetime() — each call gets its own lifetime",
  "src: src/ownership/borrow_checker.rs:988 self.context.end_borrows(&call_lifetime) — argument borrows end with the call",
