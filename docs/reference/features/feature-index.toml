# Palladium feature index
#
# WHAT THIS FILE IS. It used to be `status.yaml`, a progress tracker: every feature
# carried status glyphs and `progress: <N>`, plus a top-level `self_hosting_progress: 60%`.
# Not one of those numbers came from a measurement, several flattered the project
# ("generics: 85", "traits: 70" for features that emit no code at all), and a percentage
# is unfalsifiable by construction — no command can disagree with it. They are deleted.
#
# WHY TOML, AND NOT YAML. This was `.yaml` until 2026-08-22. Reading it required either
# PyYAML — an unprovisioned host dependency — or a hand-rolled parser, and the hand-rolled
# parser could only be held honest by differentially testing it against PyYAML, which is
# available exactly when it is not needed. That is a class of bug, not an instance: a
# second parser can always disagree with the first. TOML is in the standard library
# (`tomllib`, Python 3.11+), so there is ONE parser, nobody's fallback, and no differential
# test to maintain. This file is a machine-readable index; nothing here is hand-written
# prose that needed YAML's ergonomics.
#
# SCHEMA. One [table] per feature, nested to mirror the taxonomy:
#
#   description     what the feature is.
#   spec            where it is DEFINED. The definition does not change when the compiler
#                   does. Paths are relative to this file.
#   implementation  what `pdc` does today: implemented | partial | unimplemented
#   evidence        an array. Every item must be checkable and must begin with one of four
#                   tags. Prose is not evidence; it goes in `note`.
#   note            optional prose. Never load-bearing.
#
# EVIDENCE TAGS (enforced by scripts/check-doc-evidence.sh):
#
#   src: <path>:<line>[-<line>] <symbol or quoted text>
#       A non-documentation repository file. Path and range are checked to exist, the range
#       is pinned by fingerprint in docs/citation-pins.tsv, and any text quoted in backticks
#       or double quotes must actually appear in the cited range — a citation whose excerpt
#       does not contain the thing being claimed is the failure the pin file exists to expose.
#
#   cmd: <command> -> exit <N>, <M> lines[ -- <prose>]
#       A reproducible command and what it produced. THIS IS HOW AN ABSENCE IS PROVED:
#       a grep that returns nothing, quoted with its exit status. "There is no X" on its own
#       is an assertion, not evidence, and the gate rejects it.
#
#       THE GATE RUNS THE COMMAND. Until 2026-08-22 it did not: it checked that the string
#       had the SHAPE `cmd: X -> Y` and never executed X, so the entire absence-proving
#       mechanism was unexecuted text. Nine of the 53 items were false when first run --
#       including `grep -rn 'effects::' src/ | grep -v '^src/effects' -> 1 line`, which
#       produces 8, and `grep -rniE 'socket|TcpStream|BufReader' src/runtime/ -> exit 1,
#       0 lines`, which produces 95 over a src/runtime/net.rs the row said did not exist.
#
#       The result is therefore a contract a machine can disagree with: the exit status and
#       the line count are compared, and `exit 1, 0 lines` is the SUCCESS case for an
#       absence proof. Prose after ` -- ` is a reading of the output and carries the same
#       status a `src:` claim carries about its cited range, so it gets the same rule:
#       anything it quotes must actually appear in the output.
#
#       A `cmd:` is a HERMETIC OBSERVATION of the checked-in tree -- grep, ls, find, sort,
#       wc, over a plain pipeline, no shell. It may not run pdc, cargo or make, and may not
#       read target/ or build_output/. Nothing is skipped: an item the gate cannot run
#       hermetically is a lint error naming the gate that owns the question, because a
#       skipped item that reports nothing is the same unmeasured denominator one layer down.
#
#   conformance: <path>.pd <class>        a fixture and the class tests/conformance-manifest.txt
#                                         declares for it: run | untranscribed | vacuous |
#                                         xfail | reject | skip. The class is looked up in the
#                                         manifest, so it cannot drift. It used to be a
#                                         PASS/COMPILE_FAIL vocabulary checked against nothing
#                                         but the file's existence, which is how six rows read
#                                         `PASS (placeholder: only prints that the feature is
#                                         unimplemented)` -- the manifest's `vacuous` class
#                                         wearing the word PASS.
#   gate: <make target> -> <result>       a project gate and its outcome, EXECUTED and checked
#                                         against a receipt from that run by
#                                         `make gate-receipts`. Every key=value in the result
#                                         is compared to the gate's own output BY VALUE and must
#                                         be the ONLY value that run printed for the key —
#                                         containment let `verified=4` validate against a run
#                                         printing `verified=46`, and mere membership let a run
#                                         printing both endorse either. A result with no
#                                         key=value and no quoted span is prose and rejected.
#                                         Receipts are written to a private temporary directory
#                                         that scripts/gate-receipts.sh removes when it exits,
#                                         so the certifying path cannot discover or reuse an
#                                         earlier run's output; an earlier design wrote a run id
#                                         NEXT TO the receipts, which authenticated nothing
#                                         because the id could simply be read back. `make
#                                         check-docs` alone prints `gate=N, NONE validated`:
#                                         a gate needs a build and that target is a lint, so
#                                         the seam is counted and named rather than silent.
#
#   THE BOUNDARY THIS SCHEMA DOES NOT MECHANISE. A quoted span is checked as a substring of
#   the gate's output, because requiring it to be a whole output line would make many honest
#   rows unwritable. So a row can satisfy validation with a ubiquitous quoted span and put an
#   unsupported conclusion in the prose beside it. That prose is READ BY A HUMAN, exactly like
#   the excerpt beside a citation pin, and it is recorded here as a limit rather than left to
#   be discovered. The same applies to `note`, which is never load-bearing by construction.
#
# WHY A PROGRAM IS NOT A `cmd:`. Sixteen items used to read `cmd: pdc compile '<a whole .pd
# program>' -> <diagnostic or behaviour>`. Those are conformance fixtures written in prose.
# Executing them here would give the repository two engines that can disagree about whether a
# program is rejected -- the same class of bug as the second YAML parser above -- and would put
# a corpus of programs in nobody's closed inventory, unable to go MISSING and unable to be
# UNDECLARED. They are now real fixtures under tests/reject/ and tests/regression/, declared in
# tests/conformance-manifest.txt, and cited here as `conformance:`. Two of them arrived FALSE.
#
# CAUTION about conformance evidence. Six files under tests/ are named after a feature and
# PASS without exercising it: 07_traits_basic, 08_generics_basic, 09_effects_system,
# 10_async_await, 11_unsafe_blocks and 12_modules_imports each only `print` a message saying
# the feature is unimplemented. A green row for those names is evidence of nothing.
#
# Measured at commit 2ef170f (2026-08-22):
#   cargo build --release && scripts/conformance.sh tests examples
#     -> fixtures=70 declared_in_scope=70 evaluated=70
#        verified=46 untranscribed=0 vacuous=7 xfail=1 reject=14 skip=2 failures=0
#
# These two numbers are no longer transcribed by hand. `make gate-receipts` runs each gate
# the rows below cite, once, and requires every key=value and quoted span in a `gate:`
# result to appear in what that gate printed in THAT run. The pair above went stale within
# one commit of being written, and the receipt runner is what caught it.

[meta]
measured_at = "2ef170f"
measured_on = "2026-08-22"
specification = "../../specification/language-spec.md"
annex = "../../specification/language-spec.md#part-ii-implementation-status-annex"

[core_language.memory_management.implicit_lifetimes]
description = "Lifetimes inferred; no 'a parameter lists. Explicit ref<'a> T only on ambiguity."
spec = "core-language/implicit-lifetimes.md"
implementation = "unimplemented"
evidence = [
  "src: src/parser/mod.rs:1276 lifetime_params, populated by the parser",
  "cmd: grep -rn lifetime_params src/ --include='*.rs' | grep -v '^src/parser' -> exit 0, 90 lines -- and some are REAL readers, not only test fixtures: src/typeck/mod.rs clones the list into its own records and src/codegen/mod.rs branches on `lifetime_params.is_empty()` before emitting a type. Five of the 90 are the recursive-layout analysis in src/typeck/mod.rs, which skips a generic definition on the SAME predicate code generation uses, so that it never refuses a declaration nothing emits. Two of the 90 are prose in the shared shadowing predicate in src/ast/mod.rs, recording that its test is the type-parameter list and NOT this field",
  "conformance: tests/regression/lifetimes_uninferred.pd run",
  "src: tests/regression/lifetimes_uninferred.pd:26-29 \"fn dangling() -> &i64\" returning \"return &x;\", a reference to a local that dies at the closing brace",
  "conformance: tests/reject/uncalled_body_is_checked.pd reject",
  "src: tests/reject/uncalled_body_is_checked.pd:21-24 \"fn bad()\" is called by nothing and still refused, which is what makes the fixture above a statement about lifetimes",
  "gate: make conformance -> reject=63 verified=79 -- the pair above is in the corpus those numbers count",
  "src: src/ownership/borrow_checker.rs:793-796 the Stmt::Return arm checks the expression and stops: \"TODO: Check return value ownership matches function signature\"",
  "src: src/ownership/mod.rs:25-33 \"pub enum Lifetime\" -- the four variants a lifetime can be, none of which carries a relation to another",
  "src: src/ownership/mod.rs:101-126 \"constraints: Vec<LifetimeConstraint>\" at :101 and \"pub struct LifetimeConstraint\" at :124 with its longer/shorter pair -- the only type in the module that RELATES two lifetimes",
  "src: src/ownership/mod.rs:450-454 add_constraint, the only writer of that vector",
  "cmd: grep -rn LifetimeConstraint src/ --include='*.rs' -> exit 0, 3 lines -- the field, the struct, and the push inside add_constraint. Nothing constructs one elsewhere and nothing reads the vector",
  "cmd: grep -rn add_constraint src/ --include='*.rs' -> exit 0, 1 line -- its own definition; no other occurrence of that spelling in src/",
  "cmd: grep -rn '\\.constraints' src/ --include='*.rs' -> exit 0, 1 line -- the push inside add_constraint; no other member access to it under that spelling",
  "cmd: grep -rniE 'constraint|outliv|longer|shorter|subtyp' src/ownership/borrow_checker.rs -> exit 0, 12 lines -- every one a comment or a test name; the other half of the module declares no outlives type, field or construction of its own. The count moved 10 -> 11 on 2026-08-23 and 11 -> 12 on 2026-08-25, and BOTH new hits are PROSE, not code: the eleventh is a rewritten doc comment saying the import/local ordering \"no longer has a backstop\", and the twelfth is a comment added with N5-03 that says a branch-local binding must not outlive the branch it is bound in. `longer` and `outliv` are both in the pattern. That is exactly what an absence probe is supposed to do -- it counts the surface, and a claim about the surface has to be re-derived when the surface moves, even by a comment",
  "src: src/ownership/mod.rs:205-207 end_borrows compares two lifetimes with \"borrow.lifetime == lifetime\" -- equality, and it is now the ONLY such comparison in the file",
  "src: src/ownership/mod.rs:147-148 exit_scope no longer compares lifetimes at all -- it selects borrows by the recorded scope DEPTH, \"borrow.scope >= closing\", an integer comparison. It used to test the borrow lifetime for inequality against a Lifetime::Scope value, which is a variant nothing in the tree constructs, so that comparison released nothing; the row is stronger for the correction, since one fewer place relates two lifetimes",
]
note = "Two corrections, one of them to an argument this file made while correcting others. (1) The row used to rest on \"0 real readers; every hit is `lifetime_params: vec![]` in a test fixture\". Executed, that is false: 83 hits across 13 files, of which typeck and codegen are load-bearing. Explicit lifetime lists are parsed and carried end to end -- which is the annotation burden this feature exists to remove. (2) It then argued that nothing could INFER a lifetime because `grep -rn 'region|Region'` was empty. That does not follow, and it was written in the same row that had just found 83 readers: the absence of two identifier spellings is not a statement about behaviour. The claim is now behavioural, and stated at the width it is proved to. tests/regression/lifetimes_uninferred.pd returns a reference to a local that dies at the closing brace -- the canonical lifetime error -- and it compiles, links and runs. Its paired reject fixture shows the borrow checker DOES read the body of a function nothing calls, so that is a statement about lifetimes rather than about dead code being skipped. The code path agrees: the return arm carries a TODO where the check would be, and add_constraint -- the only way an outlives relation could be recorded -- is referenced exactly once in the tree, by its own definition. WHAT THAT ESTABLISHES, PRECISELY: there is no return-lifetime or outlives checking, which is what this feature requires and is why it is unimplemented. It does NOT establish that no limited lifetime reasoning exists anywhere in the compiler -- borrow_checker.rs mints per-call lifetimes and ends argument borrows with the call, which is how defect D6 came to be retracted. HOW FAR THE OUTLIVES CLAIM IS CHECKED, since one grep on a single symbol would not carry it: src/ownership/ is two files. THE SENTENCE THIS EVIDENCE SUPPORTS, and it is the fourth attempt at it because the previous three were each written from the conclusion inward and each landed slightly wider than the facts. Written outward from what the commands show: add_constraint (:415-418) DOES construct an ordering relation -- `LifetimeConstraint { longer, shorter }` -- so \"no ordering relation is constructed anywhere in the file\" was false on its face, at a line this row already cited. What the four probes establish is narrower and sufficient: add_constraint occurs once in all of src/, its own definition, so NO CALL SITE INVOKES IT; `.constraints` occurs once, the push inside that function, so NO CODE CONSULTS THE STORED CONSTRAINTS; LifetimeConstraint occurs three times, the field (:101), the type (:124) and that push (:417), so nothing else builds one; and the only place comparing one lifetime with another, end_borrows (:206), uses equality. (exit_scope was the second such place until it was found to be comparing against Lifetime::Scope, a variant nothing constructs, so it released no borrows at all; it now selects by integer scope depth at :148 and relates no lifetimes.) Everything else mod.rs does with lifetimes -- constructing them in new_lifetime (:256-259), storing and cloning them in borrow (:367-385), rendering them in Display (:465-474) -- is not a relation between two of them. THE SENTENCE, WRITTEN AS THE SCOPE OF THE SEARCH RATHER THAN AS A PROPERTY OF THE PROGRAM, because the fourth attempt still overreached: the probes establish TEXTUAL FACTS about src/ under particular spellings, and \"never called\" is a claim about execution. What was searched: every .rs file in the repository outside build output. What was found: add_constraint occurs once, its definition at mod.rs:415; `.constraints` occurs once, the push at :416; LifetimeConstraint occurs three times, the field (:101), the type (:124) and that push (:417). So NO CALL SITE AND NO READER OF THE OUTLIVES VECTOR APPEARS ANYWHERE IN THIS REPOSITORY UNDER THOSE SPELLINGS. Two things that search does not cover, named rather than left implicit: add_constraint is `pub` on a library crate (Cargo.toml [lib] palladium), so an out-of-tree consumer could call it -- which is not a statement about what pdc does, and pdc is what this row is about; and a caller reached through a reference or a trait object would not carry the name. Both are reasons the sentence is about the search, not about the program. In borrow_checker.rs, every occurrence of constraint/outlives/longer/shorter/subtyping is a comment or a test name -- it declares no outlives type, field or construction of its own. So the absent thing is the RELATION between lifetimes, checked across both files of the module rather than inferred from one name."

