[core_language.memory_management.array_parameter_semantics]
description = "Whether a [T; N] parameter copies or aliases the caller's array. OPEN DECISION."
spec = "../../specification/language-spec.md#n121-array-parameters-open-decision"
implementation = "unimplemented"
evidence = [
  "src: src/codegen/mod.rs:1066 Type::Array param lowered to a C array declarator, which decays to a pointer",
  "cmd: pdc compile 'fn bump(mut a: [i64;3]) { a[0]=99; } fn main(){ let mut v:[i64;3]=[1,2,3]; bump(v); print_int(v[0]); }' -> generated C is `void bump(long long a[3])`; program prints 99",
  "cmd: pdc compile 'fn bump(a: [i64;3]) { a[0]=99; } ...' (no mut) -> compiles, links, prints 99, no diagnostic",
  "src: src/codegen/mod.rs:1992 'Unsupported type in reference parameter' — &mut [T; N] does not compile at all",
]
note = "Marked unimplemented because no spelling copies. Under Option A (value semantics) this stays unimplemented and src/codegen/mod.rs:1066 is the gap. Under Option B (reference semantics) it becomes partial AT BEST, never implemented: Option B still needs a rule that does not exist — either the reference spellings are forbidden or &mut [T; N] becomes required for a written-through parameter — and current behaviour satisfies neither, permitting mutation through a bare non-mut array while rejecting &mut [T; N] outright. The specification states both options rather than picking silently; see language-spec.md N12.1 and A9.2."

[core_language.memory_management.borrow_checker]
description = "Rust-compatible ownership: moves, borrows, no GC."
spec = "../../specification/language-spec.md#n12-memory-model"
implementation = "partial"
evidence = [
  "conformance: tests/05_ownership_basic.pd PASS",
  "conformance: tests/05_borrowing_references.pd PASS",
  "src: src/typeck/mod.rs:121-125 Type::Reference maps to its inner type — 'TODO: Proper reference type handling'",
  "src: src/ownership/borrow_checker.rs:519 let call_lifetime = self.context.new_lifetime() — each call gets its own lifetime",
  "src: src/ownership/borrow_checker.rs:525 self.context.end_borrows(&call_lifetime) — argument borrows end with the call",
  "cmd: pdc compile 'fn t(a: String) -> i64 { return string_len(a); } fn main(){ let s: String = \"hello\"; print_int(t(s)); print_int(t(s)); }' -> accepted, prints 5 5 (defect D6 does not reproduce)",
  "cmd: pdc compile 'struct S { x: i64 } fn bump(s: &mut S) { s.x = 77; } fn main(){ let v: S = S { x: 1 }; bump(&mut v); print_int(v.x); }' -> compiles, links, prints 77 — an immutable local mutated with no diagnostic",
]
note = "Enforces a move/initialization discipline and conflicting-borrow detection, but is not represented in the type system. One known defect: `&mut` of an immutable local is accepted for struct types. Defect D6 (\"call arguments borrowed forever\") was FIXED in commit 191f8c1 and is retracted here — see language-spec.md A9.4 for the re-measurement. CLAUDE.md still lists D6 as open and is stale."

