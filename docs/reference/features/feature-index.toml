[advanced_features.compilation.llvm_backend]
description = "LLVM IR generation with optimisation passes."
spec = "../../specification/language-spec.md#n1-overview-and-design-commitments"
implementation = "unimplemented"
evidence = [
  "src: src/codegen/llvm_text_backend.rs:16 'const BACKEND_REFUSES: bool = true;'",
  "src: src/codegen/llvm_text_backend.rs:71-73 'pub fn compile'",
  "cmd: grep -n 'TODO: Implement' src/codegen/llvm_text_backend.rs -> exit 0, 1 line -- one survives, `TODO: Implement proper pattern matching`",
  "cmd: grep -rn -- '--llvm' scripts/ Makefile -> exit 1, 0 lines -- no gate selects this backend",
]
note = "Refuses unconditionally as of the wholesale gate; the lowering is retained for development and is exercised only through compile_unchecked in that file's tests. Two corrections from executing this row's evidence on 2026-08-22. (1) It claimed zero `TODO: Implement` comments remain; one does. It was written as `grep -c`, which prints a count and therefore always emits exactly one line -- a line-count check over it can never disagree with anything, so it is now `grep -n` and the count IS the measurement. (2) The `--llvm` probe was recorded as `exit 1, 0 lines`; run, it exited 2 with `grep: unrecognized option`, having never searched. It needed `--` to end grep's own option parsing. A command that could not look is not a proof of absence. Note that `--llvm` IS a live CLI flag (src/main.rs:114); what no gate does is select it."

