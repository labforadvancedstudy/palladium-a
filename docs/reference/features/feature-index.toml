  "src: src/codegen/mod.rs:1956 match/if lower to bare statement forms, so a tail `if` emits expression statements with no return",
]
note = "Defect D3 is half-fixed: a tail EXPRESSION becomes a return, a tail `if` does not, and the tail-`if` shape is the idiomatic one for a recursive function. CLAUDE.md:66 records D3 as fixed, which holds only for the expression case. The \"437 affected sites\" figure is an understatement -- the heuristic behind it cannot see a function ending in the else block's brace. A note on the evidence that used to sit here: it read `pdc compile 'fn fib(n: i64) -> i64 { ... fib(n-1)+fib(n-2) ... }' -> prints 8261746944`. Run, that program does not compile at all -- `fib(n-1)` lexes as `fib` applied to the literal -1, and the parser reports \"expected ')', found integer -1\". Spaced as `fib(n - 1)` it compiles and does print 8261746944, so the defect is real and the transcription was not. tests/stdlib/stdlib_tail_if_defect.pd, which spaces it, is what proves this now."

