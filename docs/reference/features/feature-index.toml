[ecosystem.std_library.io]
description = "Files, network, buffered and async I/O."
spec = "../../specification/language-spec.md#n14-builtins-and-the-standard-library"
implementation = "partial"
evidence = [
  "src: src/builtins.rs:1 the SSOT table the file and path builtins are generated from",
  "cmd: grep -rniE 'socket|TcpStream|BufReader' src/runtime/ -> exit 0, 95 lines -- src/runtime/net.rs is a complete Rust-side TCP/UDP layer, and src/runtime/mod.rs declares it",
  "cmd: grep -rniE 'socket|tcp|udp|listen|connect|bind' src/builtins.rs -> exit 1, 0 lines -- and NO builtin exposes any of it, so no Palladium program can reach a socket",
]
note = "See reference/builtins.md, generated from src/builtins.rs. The evidence here used to read \"exit 1, 0 lines -- no network, no buffering\" over src/runtime/. Executed, that command returns 95 lines: a whole net.rs exists. It is dead Rust -- nothing outside the file references it and no builtin surfaces it -- so the CONCLUSION (a Palladium program cannot open a socket) survives, but it now rests on the builtin table, which is where the language surface actually is. This is the difference between \"the code is not there\" and \"the code is there and unreachable\", and only the second one is true."

