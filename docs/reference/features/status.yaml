# Palladium feature index
#
# WHAT THIS FILE IS NOW. It used to be a progress tracker: every feature carried
# `status: ✅⏳🔲` and `progress: <N>`, plus a top-level `self_hosting_progress: 60%`.
# Not one of those numbers came from a measurement, several were false in the
# direction that flatters the project ("generics: 85", "traits: 70" for features
# that emit no code at all), and a percentage is unfalsifiable by construction —
# there is no command that can disagree with it. They are deleted, not adjusted.
#
# What remains is a FEATURE INDEX: the taxonomy (names, groupings, descriptions),
# and for each feature two things that can be checked:
#
#   spec         where the feature is DEFINED. The definition does not change when
#                the compiler does. Paths are relative to this file.
#   implementation  what `pdc` does with it today, drawn from a fixed vocabulary:
#                     implemented    — works end to end, with evidence
#                     partial        — parses or half-works; `evidence` names the break
#                     unimplemented  — not built
#   evidence     a conformance test name, a `file:line`, or a command output.
#                A row without evidence is a bug in this file.
#
# It is therefore an index, not a status report, and if it is ever renamed it should
# be renamed to say so (feature-index.yaml). The path is kept for now because the
# documents that link here use it.
#
# Measured at commit abeb665 (2026-08-22) with:
#   cargo build --release && scripts/conformance.sh   # total=42 pass=39 compile_fail=3 skipped=2
#
# CAUTION about conformance evidence. Six files under tests/ are named after a feature
# and PASS without exercising it: 07_traits_basic, 08_generics_basic, 09_effects_system,
# 10_async_await, 11_unsafe_blocks and 12_modules_imports each only `print` a message
# saying the feature is unimplemented. A green row for those names is evidence of
# nothing, and they are cited below as what they are.

feature_index:
  measured_at: "abeb665"
  measured_on: "2026-08-22"
  specification: "../../specification/language-spec.md"
  annex: "../../specification/language-spec.md#part-ii-implementation-status-annex"

  core_language:
    memory_management:
      implicit_lifetimes:
        description: "Lifetimes inferred; no 'a parameter lists. Explicit ref<'a> T only on ambiguity."
        spec: "core-language/implicit-lifetimes.md"
        implementation: unimplemented
        evidence: >-
          No region inference exists: `grep -rn 'region\|Region' src/ --include='*.rs'` returns
          nothing. Function.lifetime_params is parsed (src/parser/mod.rs:553) and read nowhere
          outside test fixtures.

      reference_syntax:
        description: "ref / ref mut instead of & and &mut."
        spec: "core-language/implicit-lifetimes.md"
        implementation: unimplemented
        evidence: >-
          `ref` is not a keyword (grammar.ebnf:58-59); it lexes as an identifier, so
          `fn f(x: ref String)` fails with "expected ')', found identifier 'String'".
          The implemented spelling is Rust's `&` / `&mut` (grammar.ebnf:145).

      borrow_checker:
        description: "Rust-compatible ownership: moves, borrows, no GC."
        spec: "../../specification/language-spec.md#n12-memory-model"
        implementation: partial
        evidence: >-
          src/ownership/borrow_checker.rs (1165 lines) enforces a move/initialization discipline
          and conflicting-borrow detection; conformance tests/05_ownership_basic.pd and
          tests/05_borrowing_references.pd PASS. Not represented in the type system: the checker
          maps Type::Reference to its inner type (src/typeck/mod.rs:121-125). Known defect: a call
          argument is borrowed as Lifetime::Named("fn") (src/ownership/borrow_checker.rs:236) and
          released against Lifetime::Scope(n), so the borrow is never released.

      unsafe_blocks:
        description: "Restricted unsafe with side-channel protection; forbidden in #![total(strict)] crates."
        spec: "../../specification/language-spec.md#n12-memory-model"
        implementation: partial
        evidence: >-
          `unsafe { }` parses (grammar.ebnf:184) and src/unsafe_ops is run by the driver
          (src/driver/mod.rs:162-170), but raw pointer types and unsafe fns do not exist.
          tests/11_unsafe_blocks.pd PASSES while only printing that the feature is unimplemented.

    type_system:
      type_inference:
        description: "Hindley-Milner with extensions; minimal annotations."
        spec: "../../specification/language-spec.md#n4-types"
        implementation: partial
        evidence: >-
          Local inference works for `let` (conformance examples/tutorial/01_variables.pd PASS;
          the i64 default was replaced by real inference in commit 04104c5). It is not
          Hindley-Milner: there is no unification engine and no polymorphic generalisation.
          Empty array literals cannot be inferred (src/typeck/mod.rs:2784).

      generics:
        description: "Monomorphization-based generics, generic structs and enums, where clauses."
        spec: "../../specification/language-spec.md#n10-traits-and-generics"
        implementation: unimplemented
        evidence: >-
          Generic struct fields are rejected in codegen — "Generic types in structs not yet
          supported" (src/codegen/mod.rs:1367). Trait bounds are a parse error; inside `<...>` an
          all-uppercase name is silently reclassified as a const argument
          (src/parser/mod.rs:2094), so `Foo<T>` does not mean what it looks like.
          tests/08_generics_basic.pd PASSES while only printing that generics are unimplemented.

      traits:
        description: "Trait definitions, impls, bounds on generics, associated types."
        spec: "../../specification/language-spec.md#n10-traits-and-generics"
        implementation: unimplemented
        evidence: >-
          Traits parse (src/parser/mod.rs:752) and then emit nothing — codegen ignores
          Item::Trait (src/codegen/mod.rs:1011) and the type checker skips trait bodies
          (src/typeck/mod.rs:795-797). A trait method declared with a `self` receiver is a parse
          error, because trait methods use a parameter loop that does not accept `self`
          (src/parser/mod.rs:875-911). tests/07_traits_basic.pd PASSES while only printing that
          traits are unimplemented.

      const_generics:
        description: "Compile-time generic parameters; arrays with generic sizes."
        spec: "../../specification/language-spec.md#n4-types"
        implementation: partial
        evidence: >-
          `const N: usize` parses (grammar.ebnf:132). In codegen an ArraySize::ConstParam is
          emitted into C verbatim as the parameter's name, and an ArraySize::Expr becomes the
          literal "0" (src/codegen/mod.rs:1349-1351). Neither is monomorphised.

    control_flow:
      pattern_matching:
        description: "match with exhaustiveness checking, destructuring, guards, wildcards."
        spec: "../../specification/language-spec.md#n6-patterns"
        implementation: partial
        evidence: >-
          Three pattern forms exist — wildcard, binding, enum path (src/ast/mod.rs:313-323);
          conformance tests/06_pattern_matching.pd PASS. No literal, range, or-, guard, tuple or
          slice patterns, so `match` cannot dispatch on an integer. Exhaustiveness is checked only
          for enum scrutinees (src/typeck/mod.rs:1349-1381).

      loops:
        description: "for over iterators, while, loop, break, continue."
        spec: "../../specification/language-spec.md#n5-statements-and-expressions"
        implementation: partial
        evidence: >-
          `for` over a range and `while` work (conformance tests/04_control_flow_for.pd,
          tests/04_control_flow_while.pd PASS). `loop` is not a keyword (grammar.ebnf:58-59).
          `for` over an array PARAMETER miscompiles: codegen emits sizeof(arr)/sizeof(arr[0]) on
          a decayed pointer (src/codegen/mod.rs:1920-1922).

      conditionals:
        description: "if/else as expressions; no ternary."
        spec: "../../specification/language-spec.md#n5-statements-and-expressions"
        implementation: partial
        evidence: >-
          `if`/`else` work as statements (conformance tests/04_control_flow_if.pd PASS). They are
          not expressions — `let x = if c { 1 } else { 2 };` does not parse — and there is no
          `else if`: after `else` the parser requires `{` (src/parser/mod.rs:1469).

    functions:
      function_definitions:
        description: "Typed parameters, optional return type, expression-oriented bodies."
        spec: "../../specification/language-spec.md#n3-program-structure-and-items"
        implementation: implemented
        evidence: >-
          conformance tests/03_functions_basic.pd PASS. Tail expressions in a function body with
          a declared return type are lowered to a return; a tail expression in a nested block is
          not.

      closures:
        description: "Anonymous functions with inferred capture; move closures."
        spec: "../../specification/language-spec.md#n5-statements-and-expressions"
        implementation: unimplemented
        evidence: "No closure token path and no closure AST node; `|x| x` does not parse."

    modules:
      module_system:
        description: "File-based modules, nested paths, visibility, `import`."
        spec: "../../specification/language-spec.md#n11-modules"
        implementation: partial
        evidence: >-
          `import` parses and must precede all items (src/parser/mod.rs:176); a resolver exists
          (src/resolver). There is no `mod` item and no `use`. tests/12_modules_imports.pd PASSES
          while only printing that the module system is unimplemented.

  error_handling:
    result_type:
      description: "Built-in Result<T, E> with Ok/Err."
      spec: "../../specification/language-spec.md#n4-types"
      implementation: unimplemented
      evidence: >-
        There is no prelude and no built-in declaration; Result and Option are ordinary user
        enums if declared. The only special-casing is that `?` typechecks against a
        Generic{name:"Result"} shape (src/typeck/mod.rs:2345).

    question_mark:
      description: "`?` for error propagation with early return."
      spec: "../../specification/language-spec.md#n5-statements-and-expressions"
      implementation: partial
      evidence: >-
        Parses and typechecks, then emits C referring to a
        `struct Result { int is_ok; union { ... } data; }` layout that no other part of codegen
        defines (src/codegen/mod.rs:2548-2569). Silent breakage: the failure surfaces in gcc.

    try_blocks:
      description: "`try { ... }` for scoped error handling."
      spec: "../../specification/language-spec.md#n5-statements-and-expressions"
      implementation: unimplemented
      evidence: "`try` is not a keyword (grammar.ebnf:52-56)."

  async_and_effects:
    async_as_effect:
      description: "Async is an algebraic effect: no async keyword, no .await, effects inferred and propagated."
      spec: "async-system/async-as-effect.md"
      implementation: unimplemented
      evidence: >-
        The implementation took the opposite shape: `async`/`await` are keywords
        (src/lexer/token.rs:111-115) and `.await` is a postfix operator (grammar.ebnf:216).
        Function.effects is hardcoded None (src/parser/mod.rs:565); the analyser in
        src/effects/mod.rs is referenced from exactly one place, src/driver/mod.rs:147, which
        only println!s the result (src/driver/mod.rs:151-157). tests/09_effects_system.pd and
        tests/10_async_await.pd PASS while only printing that the features are unimplemented.

    no_await_syntax:
      description: "No await operator; the compiler places async boundaries."
      spec: "async-system/async-as-effect.md"
      implementation: unimplemented
      evidence: >-
        `.await` exists and generates `while (!<tmp>.poll(&<tmp>)) { }` calling a poll member
        that nothing generates (src/codegen/mod.rs:2604-2611).

    effect_contexts:
      description: "with_timeout / with_retry / trace scoping over a block; effect::sync and -> async T escape hatches."
      spec: "async-system/async-as-effect.md"
      implementation: unimplemented
      evidence: "`with` and `effect` are not keywords (grammar.ebnf:52-59); no such items parse."

    automatic_parallelization:
      description: "Independent effectful operations run in parallel by default."
      spec: "async-system/async-as-effect.md"
      implementation: unimplemented
      evidence: >-
        `grep -rn 'parallel' src/effects/mod.rs src/codegen/mod.rs` returns nothing. No
        independence analysis and no scheduler.

    structured_concurrency:
      description: "Scoped tasks, automatic cancellation, no orphans."
      spec: "async-system/async-as-effect.md"
      implementation: unimplemented
      evidence: >-
        src/async_runtime/mod.rs (498 lines) exists as a Rust-side thread pool but is reachable
        only via `pub mod async_runtime` in src/lib.rs:5 — no compiler phase and no generated C
        uses it.

  advanced_features:
    verification:
      totality_checking:
        description: "#[total], #[decreases(expr)], #![total(strict)], fuel-bounded termination."
        spec: "advanced/totality-checking.md"
        implementation: unimplemented
        evidence: >-
          Attributes do not lex — `#[total]` fails with "Unexpected character '#' at line 1,
          column 1", and grammar.ebnf:66-67 has no `#` in its punctuation set. No termination
          checker exists.

      refinement_types:
        description: "Types carrying predicates, checked at compile time."
        spec: "PALLADIUM_V1_FEATURES.md#41-verification"
        implementation: unimplemented
        evidence: "No predicate syntax parses; `where` is not a keyword (grammar.ebnf:58-59)."

      proof_generation:
        description: "Export machine-checkable proofs to Lean/Coq."
        spec: "PALLADIUM_V1_FEATURES.md#41-verification"
        implementation: unimplemented
        evidence: "No proof representation exists; depends on totality_checking."

      side_channel_safety:
        description: "Constant-time guarantees for cryptographic code."
        spec: "PALLADIUM_V1_FEATURES.md#41-verification"
        implementation: unimplemented
        evidence: "No timing model in src/; nothing in src/unsafe_ops addresses timing."

    macro_system:
      unified_macros:
        description: "One macro system, pattern-based, no macro_rules!/proc-macro split."
        spec: "../../specification/language-spec.md#n3-program-structure-and-items"
        implementation: partial
        evidence: >-
          Four builtin macros exist, each taking exactly one expression
          (src/macros/mod.rs:41-54); `println!()` and `println!(a, b)` both fail. `dbg!` expands
          to a call to `print_debug`, which is defined nowhere (src/macros/mod.rs:167). User
          macros parse into a token stream that degrades unlisted tokens into
          AstToken::Ident of a debug string (src/parser/mod.rs:1274).

      hygiene:
        description: "Hygienic expansion by default."
        spec: "../../specification/language-spec.md#n3-program-structure-and-items"
        implementation: unimplemented
        evidence: "`grep -rn hygien src/ --include='*.rs'` returns nothing."

    compilation:
      incremental:
        description: "Function-level incremental compilation with dependency tracking."
        spec: "PALLADIUM_V1_FEATURES.md#6-compilation--optimization"
        implementation: unimplemented
        evidence: >-
          The driver compiles a whole program per invocation (src/driver/mod.rs:49-228). No cache
          and no dependency graph.

      parallel_pipeline:
        description: "Multi-threaded compilation pipeline."
        spec: "PALLADIUM_V1_FEATURES.md#6-compilation--optimization"
        implementation: unimplemented
        evidence: >-
          The pipeline is sequential (src/driver/mod.rs:53-183). The only thread::spawn calls in
          src/ are in src/async_runtime/mod.rs, which no compiler phase uses.

      c_backend:
        description: "C code generation; the backend the compiler actually ships."
        spec: "../../specification/language-spec.md#n1-overview-and-design-commitments"
        implementation: implemented
        evidence: >-
          conformance total=42 pass=39; `make selfhost` reaches a byte-identical fixed point.
          Generated C links against runtime/palladium_runtime.c.

      llvm_backend:
        description: "LLVM IR generation with optimisation passes."
        spec: "../../specification/language-spec.md#n1-overview-and-design-commitments"
        implementation: partial
        evidence: >-
          src/codegen/llvm_text_backend.rs (1442 lines) emits LLVM text, but bails on common
          constructs: "Unsupported iterator type in for loop" (:820), "Unsupported binary
          operator" (:1081), "Complex function calls not yet supported" (:1222), "Dynamic array
          repeat not yet supported" (:1324), "Complex reference expressions not yet supported"
          (:1363). No conformance row runs it.

      optimizer:
        description: "Inlining, const propagation, dead code elimination."
        spec: "../../specification/language-spec.md#n1-overview-and-design-commitments"
        implementation: partial
        evidence: >-
          src/optimizer runs by default in the driver (src/driver/mod.rs:172-181); constant
          folding, dead code and simplify passes have unit tests. gcc receives an explicit -O
          level since commit e72c39b.

  tooling:
    compiler:
      pdc:
        description: "The compiler."
        spec: "../../specification/language-spec.md"
        implementation: implemented
        evidence: "cargo build --release; conformance total=42 pass=39 compile_fail=3 skipped=2."

      bootstrapping:
        description: "A Palladium compiler that compiles its own source to a fixed point."
        spec: "../../specification/bootstrap-subset.md"
        implementation: implemented
        evidence: >-
          `make selfhost` — bootstrap/pdc.pd compiles itself and the stage1/stage2 outputs are
          byte-identical. The subset it implements is PBS-1, which is deliberately smaller than
          what pdc accepts.

    developer_tools:
      formatter:
        description: "pdfmt — automatic code formatting."
        spec: "PALLADIUM_V1_FEATURES.md#72-development-tools"
        implementation: unimplemented
        evidence: "No pdfmt binary: Cargo.toml declares only pdc, pdm and pls (Cargo.toml:45-56)."

      lsp_server:
        description: "pls — completion, go-to-definition, diagnostics."
        spec: "PALLADIUM_V1_FEATURES.md#72-development-tools"
        implementation: partial
        evidence: >-
          A `pls` binary is built from src/bin/pls.rs (Cargo.toml:53-55) over src/lsp, which has
          completion and diagnostics modules. No conformance or integration row covers it.

      debugger:
        description: "GDB/LLDB integration, source-level debugging."
        spec: "PALLADIUM_V1_FEATURES.md#72-development-tools"
        implementation: unimplemented
        evidence: "No debug-info emission in src/codegen; generated C carries no #line directives."

    package_management:
      cargo_compat:
        description: "Read Cargo.toml, resolve dependencies compatibly."
        spec: "PALLADIUM_V1_FEATURES.md#73-package-management"
        implementation: partial
        evidence: >-
          A `pdm` binary is built from src/bin/pdm.rs over src/package (2924 lines including a
          registry module). tests/projects/hello_pdm exercises it partially:
          tests/projects/hello_pdm/tests/test_math.pd is one of the three conformance
          COMPILE_FAILs ("Undefined function: add").

      registry:
        description: "Central package registry with version management."
        spec: "PALLADIUM_V1_FEATURES.md#73-package-management"
        implementation: unimplemented
        evidence: "src/package/registry.rs (464 lines) is local-only; no registry is deployed."

  ecosystem:
    std_library:
      core:
        description: "Core types and traits, memory utilities, iterator protocol."
        spec: "PALLADIUM_V1_FEATURES.md#5-standard-library"
        implementation: unimplemented
        evidence: >-
          stdlib/std/*.pd exists but does not parse — `pdc compile stdlib/std/option.pd` fails
          with "Expected 'fn' for method, but found 'pub'". scripts/conformance.sh scans only
          tests/ and examples/, so stdlib/ has never had a green row.

      collections:
        description: "Vec<T>, HashMap<K, V>, String, Option<T>."
        spec: "PALLADIUM_V1_FEATURES.md#5-standard-library"
        implementation: unimplemented
        evidence: >-
          `vec![e]` expands to a 1-element array, not a growable vector
          (src/macros/mod.rs:41-54). Generic types do not survive codegen
          (src/codegen/mod.rs:1367), so no generic container can exist yet.

      io:
        description: "Files, network, buffered and async I/O."
        spec: "../../specification/language-spec.md#n14-builtins-and-the-standard-library"
        implementation: partial
        evidence: >-
          File and path operations exist as builtins generated from src/builtins.rs and linked
          against runtime/palladium_runtime.c; see reference/builtins.md. There is no network,
          no buffering, and no async I/O.

    interop:
      rust_ffi:
        description: "Call Rust from Palladium, share data structures."
        spec: "PALLADIUM_V1_FEATURES.md#8-interoperability"
        implementation: unimplemented
        evidence: >-
          There is no `extern` item (grammar.ebnf:58-59, :69-72). The Rust-side
          `extern "C"` symbols in src/runtime/ are the compiler's own runtime, not a user-facing
          FFI.

      c_ffi:
        description: "C ABI compatibility; call C libraries and export to C."
        spec: "PALLADIUM_V1_FEATURES.md#8-interoperability"
        implementation: partial
        evidence: >-
          Everything compiles through C and links with gcc, so the ABI is C by construction, but
          there is no declaration syntax for importing a C symbol: `extern` is not a keyword.

      wasm:
        description: "WASM target with WASI support."
        spec: "PALLADIUM_V1_FEATURES.md#8-interoperability"
        implementation: unimplemented
        evidence: "No wasm target in src/codegen; the only backends are C and the LLVM text backend."
